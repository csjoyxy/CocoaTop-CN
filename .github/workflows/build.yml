name: CI

on:
  push:
    branches:
      - master
      - "l10n/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: prepare environment
      run: |
        brew install ldid make
        echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
        echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

    - name: verify updated cache
      id: verify-cache
      run: |
        echo "heads=$(git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1)-$(git ls-remote https://github.com/xybp888/iOS-SDKs | head -n 1 | cut -f 1)" >> $GITHUB_OUTPUT

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/theos
        key: ${{ runner.os }}-${{ steps.verify-cache.outputs.heads }}

    - name: get theos
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: 'theos'
        repository: theos/theos

    - name: get sdks
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        curl -LO https://github.com/xybp888/iOS-SDKs/archive/master.zip
        TMP=$(mktemp -d)
        unzip -o -q master.zip -d $TMP
        mkdir -p "${{ github.workspace }}/theos/sdks"
        mv $TMP/iOS-SDKs-master/*.sdk "${{ github.workspace }}/theos/sdks"
        rm -r master.zip $TMP

    - name: actual build
      run: |
        mkdir -p packages
        rm -f packages/*
        make ipa FINALPACKAGE=1

    - name: upload deb
      uses: actions/upload-artifact@v4
      with:
        name: 'Package-deb'
        path: ${{ github.workspace }}/packages/*.deb

    - name: upload tipa
      uses: actions/upload-artifact@v4
      with:
        name: 'Package-tipa'
        path: ${{ github.workspace }}/packages/*.tipa
